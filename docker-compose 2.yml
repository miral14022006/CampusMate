version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: college_assistant_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: college_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: college_assistant_nlp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NLP_PORT=8000
      - NLP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./nlp-service:/app
      - ./data:/data
    depends_on:
      - redis

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: college_assistant_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/college_assistant
      - REDIS_URL=redis://redis:6379
      - NLP_SERVICE_URL=http://nlp-service:8000
    depends_on:
      - mongodb
      - redis
      - nlp-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: college_assistant_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
  redis_data:

