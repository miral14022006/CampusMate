# CampusMate SPA — standalone container config.
# Serves the built Vite app with history fallback and proxies the API so the
# container can be used on its own (docker compose, local QA).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression for text assets. Brotli would require the ngx_brotli module;
    # enable gzip here so the image works on stock nginx.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # Container healthcheck (does not touch the gateway).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Gateway health (proxied so the smoke test can target the public SPA origin).
    location = /health {
        proxy_pass http://server:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway API (used when this container is the public origin).
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # Optional direct NLP access (matches the Vite dev proxy).
    location /nlp/ {
        proxy_pass http://nlp-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Immutable hashed assets emitted by Vite.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /images/campus-hero.jpg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # SPA history fallback. index.html is never cached so new deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
