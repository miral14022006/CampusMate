version: '3.8'

services:
  # 1. Python FastAPI NLP Service
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: college-assistant-nlp-prod
    restart: always
    environment:
      - PORT=8000
      - NLP_SERVICE_API_KEY=${NLP_SERVICE_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
      - LITE_MODE=${LITE_MODE:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - assistant-net
    deploy:
      resources:
        limits:
          memory: 1536M

  # 2. Redis Cache & Hot Session State
  redis:
    image: redis:7-alpine
    container_name: college-assistant-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    networks:
      - assistant-net
    deploy:
      resources:
        limits:
          memory: 256M

  # 3. Node.js API Gateway & Telegram Bot
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: college-assistant-server-prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - NLP_SERVICE_URL=http://nlp-service:8000
      - NLP_SERVICE_API_KEY=${NLP_SERVICE_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      - nlp-service
      - redis
    networks:
      - assistant-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 4. React SPA (built with Vite, served by nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: college-assistant-client-prod
    restart: always
    depends_on:
      - server
    networks:
      - assistant-net
    deploy:
      resources:
        limits:
          memory: 128M

  # 5. Nginx Reverse Proxy with SSL termination & security
  nginx:
    image: nginx:alpine
    container_name: college-assistant-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
      - client
    networks:
      - assistant-net

networks:
  assistant-net:
    driver: bridge

volumes:
  redis_prod_data:

