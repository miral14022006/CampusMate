services:
  caddy:
    image: caddy:2-alpine
    container_name: campusmate_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/campusmate/caddy/data:/data
      - /opt/campusmate/caddy/config:/config
    depends_on:
      - client
      - server

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://api.miralpatel.tech
    container_name: campusmate_client
    restart: always
    expose:
      - "80"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campusmate_server
    restart: always
    expose:
      - "5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - NLP_SERVICE_URL=http://nlp-service:8000
      - NLP_API_KEY=${NLP_API_KEY}
      - MONGODB_URI=${MONGODB_URI}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:-pdeu.ac.in,campus.edu,gmail.com}
      - GUEST_MODE=false
      - APP_BASE_URL=https://campus-mate.miralpatel.tech
      - CORS_ORIGIN=https://campus-mate.miralpatel.tech,https://www.campus-mate.miralpatel.tech
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL:-admin18@pdpu.ac.in}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD:-Admin@18}
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - /opt/campusmate/data/uploads:/app/data/uploads
    depends_on:
      nlp-service:
        condition: service_healthy

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: campusmate_nlp
    restart: always
    expose:
      - "8000"
    environment:
      - PORT=8000
      - APP_ENV=production
      - NLP_API_KEY=${NLP_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - ENABLE_RERANKER=true
      - HF_HOME=/home/appuser/.cache/huggingface
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - /opt/campusmate/data/uploads:/data/uploads
      - /opt/campusmate/data/index:/data/index
      - /opt/campusmate/models/huggingface:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
